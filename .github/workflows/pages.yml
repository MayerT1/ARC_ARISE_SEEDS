name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh Earth Engine tiles"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PLANNER: "Task 2 Multi-County Feasibility Study and Greenbelt Corridor Planning/greenbelt_corridor_planner"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r "$PLANNER/docs/." _site/
          if [ -f greenbelt_corridor_planner.png ]; then cp greenbelt_corridor_planner.png _site/assets/; fi
          cp "$PLANNER/FACT_SHEET.md" _site/FACT_SHEET.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
